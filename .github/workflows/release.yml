# Builds and publishes a release when a version tag is pushed: the five binaries, SHA256SUMS and the installer.
# Runs on macOS so the macOS binaries get their ad-hoc signature.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile
      - name: The tag matches the version in the code
        run: |
          version=$(bun -e 'console.log((await import("./src/version.ts")).VERSION)')
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME but src/version.ts says $version"; exit 1; }
      - run: bun test
      - run: sh scripts/build-release.sh
      - run: bash scripts/install-check.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp install.sh dist/release/install.sh
          gh release create "$GITHUB_REF_NAME" dist/release/* --title "solobooks ${GITHUB_REF_NAME#v}" --generate-notes
